name: MacDiffStudio
options:
  bundleIdPrefix: io.github.michaeldadi
  deploymentTarget:
    macOS: "27.0"
  generateEmptyDirectories: true
packages:
  MacDiffStudioCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  MacDiffStudio:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mac Diff Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://michaeldadi.github.io/mac-diff-studio/appcast.xml
        SUPublicEDKey: VSfGne1/1drahXuPUd0BdomB2P/sUNppRjTtKihb0+8=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: Mac Diff Studio
            CFBundleURLSchemes:
              - macdiffstudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.michaeldadi.macdiffstudio
        PRODUCT_NAME: Mac Diff Studio
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - package: MacDiffStudioCore
        product: DiffCore
      - package: MacDiffStudioCore
        product: GitCore
      - package: MacDiffStudioCore
        product: FolderCore
      - package: Sparkle
    scheme:
      testTargets: []

