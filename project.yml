name: Vellograph
options:
  bundleIdPrefix: io.github.michaeldadi
  deploymentTarget:
    macOS: "27.0"
  generateEmptyDirectories: true
packages:
  VellographCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Vellograph:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vellograph
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://michaeldadi.github.io/vellograph/appcast.xml
        SUPublicEDKey: VSfGne1/1drahXuPUd0BdomB2P/sUNppRjTtKihb0+8=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: Vellograph
            CFBundleURLSchemes:
              - vellograph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.michaeldadi.vellograph
        PRODUCT_NAME: Vellograph
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - package: VellographCore
        product: DiffCore
      - package: VellographCore
        product: GitCore
      - package: VellographCore
        product: FolderCore
      - package: Sparkle
    scheme:
      testTargets: []

